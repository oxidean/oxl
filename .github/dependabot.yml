# Dependency maintenance — weekly batch, grouped so majors stay reviewable.
#
# Covered:
#   github-actions  — workflow action refs

version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions:
        update-types:
          - minor
          - patch
