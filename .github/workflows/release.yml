name: release

on:
  push:
    branches: [main]
    tags: ["v*", "extra/v*"]
  workflow_dispatch:

permissions:
  contents: write
  # The docs-manifest bump merges through a bot-opened PR — main's ruleset
  # requires changes to arrive via pull request.
  pull-requests: write

# serializes main merges and tag pushes so version computation never races
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    # Poll bound plus tag/emit headroom: the bump PR's required checks
    # include the windows leg whose ci.yml cap is 150min, so the job must
    # outlive it with margin or the poll always exits on "never reached a
    # clean state" before the leg reports.
    timeout-minutes: 240
    # Job-level grants replace the workflow-level block — all three are
    # restated: contents (tag/branch pushes), pull-requests (bump PR),
    # actions (approve held runs on the bot-authored bump PR).
    permissions:
      contents: write
      pull-requests: write
      actions: write
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      sha: ${{ steps.sha.outputs.sha }}
      etag: ${{ steps.v.outputs.etag }}
      do_tool: ${{ steps.v.outputs.do_tool }}
      do_extra: ${{ steps.v.outputs.do_extra }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags + history for semver scan
          persist-credentials: false
      - id: v
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$REF_NAME" != "main" ]; then
            echo "workflow_dispatch releases only from main" >&2
            exit 1
          fi
          echo "do_tool=false" >> "$GITHUB_OUTPUT"
          echo "do_extra=false" >> "$GITHUB_OUTPUT"
          echo "etag=" >> "$GITHUB_OUTPUT"
          if [ "$REF_TYPE" = "tag" ]; then
            tag_sha=$(git rev-list -n1 "$REF_NAME")
            # a release tag may only release commits that are on main —
            # otherwise a tag push could ship unreviewed code
            # (fetch-depth:0 gives origin/main)
            if ! git merge-base --is-ancestor "$tag_sha" origin/main; then
              echo "tag $REF_NAME points at $tag_sha, which is not on main" >&2
              exit 1
            fi
            case "$REF_NAME" in
              extra/v*)
                echo "do_extra=true" >> "$GITHUB_OUTPUT"
                echo "etag=$REF_NAME" >> "$GITHUB_OUTPUT"
                ;;
              *)
                echo "do_tool=true" >> "$GITHUB_OUTPUT"
                echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"
                ;;
            esac
            echo "sha=$tag_sha" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ -z "$EVENT_BEFORE" ] \
          || [ "$EVENT_BEFORE" = "0000000000000000000000000000000000000000" ] \
          || ! git cat-file -e "$EVENT_BEFORE^{commit}" 2>/dev/null; then
            range="HEAD~1..HEAD"
          else
            range="$EVENT_BEFORE..$SHA"
          fi
          # A manifest-bump merge self-triggers this run with a range of
          # only its own chore commit — nothing new to release (#203).
          # A rerun of a publish that died after tagging re-enters with
          # its tag already at SHA, so that case falls through to the
          # normal recovery path below.
          if [ -z "$(git tag --points-at "$SHA" | grep -xE 'v[0-9]+\.[0-9]+\.[0-9]+')" ] \
          && [ -z "$(git log --format=%s "$range" | grep -vE '^chore\(release\):')" ]; then
            echo "sha=$SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # lane split: the toolchain releases when anything outside
          # extra/ moved since the last bare v* tag; extras get their own
          # extra/v* tag series when paths under extra/ moved since the
          # last extra/v* tag. A pure-extras merge ships only the extras
          # lane; a pure-toolchain merge only the toolchain lane.
          latest_v=$(scripts/release-version.sh latest)
          if [ -n "$latest_v" ]; then
            vbase=$(git rev-list -n1 "v$latest_v")
            changed=$(git diff --name-only "$vbase" "$SHA")
          else
            changed=$(git ls-files)
          fi
          latest_e=$(scripts/release-version.sh latest extra/)
          if [ -n "$latest_e" ]; then
            ebase=$(git rev-list -n1 "extra/v$latest_e")
            echanged=$(git diff --name-only "$ebase" "$SHA" -- extra/)
            erange="$ebase..$SHA"
          else
            echanged=$(git ls-files -- extra/)
            erange="HEAD"
          fi
          # recovery: a toolchain tag already on this sha — or on the
          # manifest-bump child this flow creates — is reused instead of
          # burning another version. The docs-manifest sync below tags a
          # bump commit one above the merge, so a retry's tag also lives
          # on a direct child of sha.
          tag=$(git tag --points-at "$SHA" | grep -xE 'v[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -1 || true)
          tagsha=""
          if [ -z "$tag" ]; then
            for child in $(git rev-list --all --children | awk -v s="$SHA" '$1==s {$1=""; print}'); do
              # Only the manifest-bump commit this flow creates is a valid
              # recovery target — a tagged child on another branch would
              # publish an unrelated tree under this tag.
              git merge-base --is-ancestor "$child" origin/main 2>/dev/null || continue
              git log -1 --format=%s "$child" | grep -q '^chore(release): bump docs manifest to ' || continue
              tag=$(git tag --points-at "$child" | grep -xE 'v[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -1 || true)
              [ -n "$tag" ] && { tagsha=$child; break; }
            done
          fi
          # lane gate: non-extra paths changed since the last toolchain
          # tag. A manual dispatch bypasses the path check only for tag
          # recovery — an untagged sha has nothing to recover, so an
          # extras-only dispatch must not mint a new toolchain release.
          if { [ -n "$changed" ] && printf '%s\n' "$changed" | grep -qv '^extra/'; } || { [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$tag" ]; }; then
            do_tool=true
            [ -n "$tagsha" ] && SHA=$tagsha
            if [ -z "$tag" ]; then
              tag=$(scripts/release-version.sh next "$range")
            fi
            # Manifest floor (#203): the manifest can run ahead of the tag
            # series when a prior run stamped the version but died before
            # tagging. `next` over this push's range then computes below
            # the declared version, and the sha step would stamp a
            # downgrade bump PR. Suppress instead — the next feature push
            # recomputes over the tag series and converges on it.
            mver="$(git show "origin/main:docs/site/manifest.yaml" 2>/dev/null \
              | sed -nE 's/^version[[:space:]]*:[[:space:]]*"?([^"[:space:]]*)"?[[:space:]]*$/\1/p' | head -1 || true)"
            if [ -z "$mver" ] || [ "${tag#v}" = "$mver" ] \
            || [ "$(printf '%s\n%s\n' "$mver" "${tag#v}" | sort -V | tail -1)" != "$mver" ]; then
              echo "do_tool=true" >> "$GITHUB_OUTPUT"
              echo "tag=$tag" >> "$GITHUB_OUTPUT"
            else
              echo "computed tag $tag is below manifest version $mver — stale-range downgrade suppressed (#203)" >&2
            fi
          fi
          if [ -n "$echanged" ]; then
            etag=$(git tag --points-at "$SHA" | grep -xE 'extra/v[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -1 || true)
            [ -z "$etag" ] && etag=$(scripts/release-version.sh next "$erange" extra/)
            echo "do_extra=true" >> "$GITHUB_OUTPUT"
            echo "etag=$etag" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      # The docs bundle packs from the tagged tree and the packer gates the
      # manifest version against the tag, so an auto-release must tag a
      # commit whose docs/site/manifest.yaml already declares it. main is
      # PR-only, so the bump lands through a bot-opened squash merge and the
      # tag points at that merge commit. A tag already on this sha (a retry
      # after a failed publish) has a fixed tree — reuse it instead.
      - id: sha
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ steps.v.outputs.tag }}
          SHA: ${{ steps.v.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          emit() { echo "sha=$1" >> "$GITHUB_OUTPUT"; }
          if [ "$REF_TYPE" = "tag" ] || [ -z "$TAG" ]; then emit "$SHA"; exit 0; fi
          if git tag --points-at "$SHA" | grep -qx "$TAG"; then emit "$SHA"; exit 0; fi
          manifest=docs/site/manifest.yaml
          if [ ! -f "$manifest" ]; then
            echo "no docs/site manifest — release proceeds without a bundle"
            emit "$SHA"; exit 0
          fi
          ver="${TAG#v}"
          current="$(sed -nE 's/^version[[:space:]]*:[[:space:]]*"?([^"[:space:]]*)"?[[:space:]]*$/\1/p' "$manifest" | head -1)"
          if [ "$current" = "$ver" ]; then emit "$SHA"; exit 0; fi
          sed -i -E "s/^version[[:space:]]*:.*/version: \"$ver\"/" "$manifest"
          # The version line exists but can't be parsed or rewritten — the
          # tag would carry a stale manifest and the docs pack fails later.
          # Stop here, before the tag/publish steps, instead of shipping
          # the toolchain without its docs bundle.
          if git diff --quiet -- "$manifest"; then
            echo "::error::could not set docs manifest version to $ver (missing or unparseable version line)"
            exit 1
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -am "chore(release): bump docs manifest to $ver"
          git remote set-url origin "https://github.com/${{ github.repository }}.git"
          gh auth setup-git --hostname github.com
          git fetch origin main -q
          # A previous attempt may have merged the bump but died before
          # tagging — reuse the commit that set the version rather than
          # opening a second bump PR.
          bumped="$(git show "origin/main:$manifest" 2>/dev/null | sed -nE 's/^version[[:space:]]*:[[:space:]]*"?([^"[:space:]]*)"?[[:space:]]*$/\1/p' | head -1)"
          if [ "$bumped" = "$ver" ]; then
            emit "$(git rev-list -n1 --first-parent origin/main -- "$manifest")"
            exit 0
          fi
          # Open the bump as a PR and squash-merge it: main rejects direct
          # pushes. The merge commit carries the matching manifest and sits
          # on main, so it is the tag target.
          # The bump commit was made above on the detached HEAD — branching
          # here keeps it, so no second commit is needed.
          branch="docs-manifest-bump/$TAG"
          git checkout -b "$branch"
          git push -f origin "$branch"
          expected_sha="$(git rev-parse HEAD)"
          # Pin resolution to base=main and the pushed head SHA — head
          # branches can carry PRs against other bases, and the merge must
          # target this exact bump commit. A lookup failure is not an empty
          # result: retry, then refuse to create a possible duplicate.
          resolve_pr() {
            local out any
            for _ in 1 2 3 4 5 6; do
              # Test gh's status directly — a piped head -1 would mask a
              # lookup failure as "no PR" wherever pipefail isn't set.
              if ! out="$(gh pr list --head "$branch" --base main --state open \
                  --json number,baseRefName,headRefOid \
                  --jq ".[] | select(.baseRefName==\"main\" and .headRefOid==\"$expected_sha\") | .number")"; then
                sleep 10
                continue
              fi
              if [ -n "$out" ]; then
                printf '%s\n' "$out" | head -1
                return 0
              fi
              # Empty pinned output right after a force-push is a stale
              # headRefOid read, not "no PR" — returning success here sent
              # callers into gh pr create, which then failed on the
              # existing PR and killed the release (v0.18.0 jam). Only an
              # existence probe that comes back empty may fall through to
              # create; a PR at another SHA keeps retrying.
              if any="$(gh pr list --head "$branch" --base main --state open \
                  --json number --jq '.[0].number // ""')"; then
                [ -z "$any" ] && return 0
              fi
              sleep 10
            done
            return 1
          }
          pr="$(resolve_pr)" || { echo "::error::bump PR lookup failed for $branch — refusing to create a duplicate"; exit 1; }
          if [ -z "$pr" ]; then
            gh pr create --base main --head "$branch" \
              --title "chore(release): bump docs manifest to $ver" \
              --body "Automated docs-manifest sync for $TAG — the docs bundle packs from the tagged tree and gates on manifest.version == tag." \
              || { echo "::error::gh pr create failed for $branch"; exit 1; }
            # gh pr create prints only the URL — re-read the number via list.
            pr="$(resolve_pr)" || { echo "::error::post-create bump PR lookup failed for $branch"; exit 1; }
          fi
          if [ -z "$pr" ]; then
            echo "::error::could not resolve bump PR number for $branch"
            exit 1
          fi
          # The bump PR is bot-authored: its pull_request runs arrive held at
          # action_required (GITHUB_TOKEN can't self-trigger), so required
          # checks never report and branch policy blocks the merge. Approve
          # held runs every poll — late-spawning runs get caught too — and
          # wait on mergeStateStatus rather than mergeable, which reports
          # conflicts only and stays MERGEABLE while required checks pend.
          state=""
          merged_gate=0
          updates=0
          reran=""
          # ~200min of polling inside the 240min job timeout — the bound must
          # exceed the slowest required leg on the bump PR (windows build-test
          # caps at 150min under ci.yml, observed ~1h51m) plus queue and
          # rerun-failed-jobs slack, or the version job dies on "never reached
          # a clean state" while a green-in-progress leg still pends.
          deadline=$((SECONDS + 12000))
          while [ "$SECONDS" -lt "$deadline" ]; do
            # Held runs surface under different markers across API shapes —
            # match all reported forms, and scope to the current head SHA so
            # stale runs on older heads are never approved. -X GET keeps the
            # -f fields as query params; without it gh api posts them as a
            # body and the runs endpoint 404s, killing the approve pass.
            if held_json="$(gh api "repos/${{ github.repository }}/actions/runs" -X GET \
                -f "branch=$branch" -f event=pull_request -f "head_sha=$expected_sha" \
                -f per_page=50 2>/dev/null)"; then
              held="$(printf '%s' "$held_json" | jq -r '.workflow_runs[] | select(.status=="waiting" or .status=="action_required" or .conclusion=="action_required") | .id' 2>/dev/null || true)"
            else
              held=""
              echo "::warning::held-run query failed — approve pass skipped this round"
            fi
            for rid in $held; do
              if err="$(gh api -X POST "repos/${{ github.repository }}/actions/runs/$rid/approve" 2>&1)"; then
                echo "approved held run $rid"
              else
                echo "::warning::approve call failed for held run $rid — $err"
              fi
            done
            prline="$(gh pr view "$pr" --json state,mergeStateStatus \
                --jq '"\(.state) \(.mergeStateStatus)"' 2>/dev/null)" || {
              echo "::warning::could not read merge state for bump PR #$pr — retrying"
              sleep 20
              continue
            }
            prstate="${prline%% *}"
            state="${prline##* }"
            case "$prstate" in
              # A closed bump PR reports mergeStateStatus=BLOCKED forever —
              # the poll would burn the whole bound on a gate that can never
              # clear. Fail fast; a rerun resolves no open PR and re-cuts.
              CLOSED)
                echo "::error::bump PR #$pr was closed — rerun the release"
                exit 1 ;;
              # An externally merged bump already sits on main — the merge
              # step below probes state and treats it as landed.
              MERGED) merged_gate=1; break ;;
            esac
            case "$state" in
              CONFLICTING|DIRTY)
                echo "::error::bump PR #$pr conflicts with main — rerun the release"
                exit 1 ;;
            esac
            # Gate on every check, not just required ones: a failed check on
            # the release cut stops the tag, and a still-pending check keeps
            # the loop waiting. cancel counts as fail — a cancelled required
            # check must not slip through as "settled". ACTION_REQUIRED runs
            # are held, not failed — the approve pass above releases them.
            # A failed query is not a pass — retry it.
            # gh pr checks exits non-zero when any check pends/fails even with
            # --json — the read guard tests stdout, so JSON still lands first.
            if ! read -r fails pending < <(gh pr checks "$pr" --json bucket,state \
                --jq '"\([.[]|select((.bucket=="fail" or .bucket=="cancel") and .state!="ACTION_REQUIRED")]|length) \([.[]|select(.bucket=="pending" or .state=="ACTION_REQUIRED")]|length)"' 2>/dev/null); then
              echo "::warning::could not read checks for bump PR #$pr — retrying"
              sleep 20
              continue
            fi
            if [ "$fails" != "0" ]; then
              # A failed/cancelled leg whose run is complete can be a
              # provisioning flake rather than a real failure — observed:
              # macOS legs queued ~15min then cancelled with zero steps.
              # Re-run failed jobs once per run; a real failure fails
              # again and exits on the next poll, a flake re-pends and the
              # loop waits it out.
              rerun=0
              for rid in $(gh pr checks "$pr" --json link,state,bucket \
                  --jq '.[] | select((.bucket=="fail" or .bucket=="cancel") and .state!="ACTION_REQUIRED") | .link | capture("runs/(?<r>[0-9]+)").r' 2>/dev/null); do
                case " $reran " in *" $rid "*) continue ;; esac
                if gh api -X POST "repos/${{ github.repository }}/actions/runs/$rid/rerun-failed-jobs" >/dev/null 2>&1; then
                  reran="$reran $rid"; rerun=1
                  echo "bump PR #$pr check on run $rid failed/cancelled — re-ran failed jobs"
                fi
              done
              if [ "$rerun" = "1" ]; then sleep 30; continue; fi
              # Other legs still in flight settle first — only error once
              # the check set is terminal and no rerun was accepted.
              if [ "$pending" != "0" ]; then sleep 20; continue; fi
              echo "::error::bump PR #$pr has a failing check — rerun the release"
              gh pr checks "$pr" || true
              exit 1
            fi
            case "$state" in
              CLEAN) merged_gate=1; break ;;
              UNSTABLE) if [ "$pending" = "0" ]; then merged_gate=1; break; fi ;;
              # BEHIND fails the merge outright when the ruleset requires
              # up-to-date branches. update-branch via the API won't spawn
              # checks under GITHUB_TOKEN, so merge main locally and push —
              # the synchronize runs arrive held like the original ones and
              # the approve loop picks them up once expected_sha tracks the
              # new head.
              BEHIND)
                if [ "$pending" = "0" ]; then
                  if [ "$updates" -lt 3 ]; then
                    updates=$((updates+1))
                    if git merge --abort 2>/dev/null; git fetch origin main -q \
                      && git -c user.name="github-actions[bot]" \
                           -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                           merge --no-edit origin/main >/dev/null 2>&1 \
                      && git push -f origin "$branch" >/dev/null 2>&1; then
                      expected_sha="$(git rev-parse HEAD)"
                      # The PR follows the branch — headRefOid lags the push
                      # briefly, so keep the old number if re-resolution
                      # hasn't caught up yet.
                      newpr="$(resolve_pr || true)"
                      [ -n "$newpr" ] && pr="$newpr"
                      echo "bump PR #$pr BEHIND — merged main and pushed ($updates/3)"
                    else
                      echo "::warning::could not merge main into bump branch — retrying"
                    fi
                  else
                    echo "::error::bump PR #$pr could not be brought up to date — rerun the release"
                    exit 1
                  fi
                fi ;;
            esac
            sleep 20
          done
          if [ "$merged_gate" != "1" ]; then
            echo "::error::bump PR #$pr never reached a clean state (mergeStateStatus=$state)"
            gh pr checks "$pr" || true
            exit 1
          fi
          # The default squash body folds in "Co-authored-by: github-actions[bot]"
          # (merger != author) and trips the bot-trailer ban in commit-lint —
          # pin an explicit message instead.
          merged_now=0
          for i in 1 2 3; do
            if gh pr merge "$pr" --squash --delete-branch \
              --subject "chore(release): bump docs manifest to $ver" \
              --body "Automated docs-manifest sync for $ver — the docs bundle packs from the tagged tree and gates on manifest.version == tag."; then
              merged_now=1
              break
            fi
            # gh pr merge fails non-zero even when the merge landed but a
            # trailing op (e.g. --delete-branch) errored — probe state first.
            if [ "$(gh pr view "$pr" --json state --jq '.state' 2>/dev/null || true)" = "MERGED" ]; then
              merged_now=1
              break
            fi
            [ "$i" = "3" ] || sleep 5
          done
          [ "$merged_now" = "1" ] || { echo "::error::bump PR #$pr merge refused after clean state"; exit 1; }
          mc=""
          for i in $(seq 1 15); do
            mc="$(gh pr view "$pr" --json mergeCommit,state --jq 'select(.state=="MERGED") | .mergeCommit.oid' || true)"
            [ -n "$mc" ] && break
            sleep 2
          done
          [ -n "$mc" ] || { echo "::error::bump PR #$pr did not report merged"; exit 1; }
          emit "$mc"

  release:
    needs: version
    if: needs.version.outputs.do_tool == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false # build/test steps run dep code; publish uses github.token directly
      - name: build stage-0 seed
        run: bash scripts/stage0.sh
      - name: test suite (gate)
        run: bash tests/run.sh ./target/oxl
      - name: package toolchain
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          mkdir -p dist/oxl-toolchain
          # the suite gate above built and validated the product driver
          # (target/oxl-self) — ship it, not the stage-0 snapshot it
          # was bootstrapped from
          cp target/oxl-self dist/oxl-toolchain/oxl
          cp -r std examples dist/oxl-toolchain/
          # the product driver locates runtime/rt.c beside the binary
          # (exe-walk) for the cc step, and gui_shim.c includes
          # ../../runtime/rt.h — ship both at the same relative spot
          mkdir -p dist/oxl-toolchain/runtime
          cp runtime/rt.h runtime/rt.c dist/oxl-toolchain/runtime/
          cp LICENSE dist/oxl-toolchain/
          # the version manager + `oxl version` read this file for the tag
          echo "$RELEASE_TAG" > dist/oxl-toolchain/RELEASE
          # the repo README documents building from bootstrap/stage0 and
          # other paths the archive doesn't ship — give it release steps
          cat > dist/oxl-toolchain/README.md <<'EOF2'
          # oxl toolchain

          The `oxl` compiler plus `std/` library sources and `examples/` pilots.

          ```sh
          ./oxl run examples/hello.oxl    # compile + run (needs cc on PATH)
          ./oxl build examples/http-crud-sqlite/main.oxl   # sqlite pilots also need libsqlite3-dev
          ```

          `import "std/x"` resolves against `std/` next to the binary.
          EOF2
          cd dist && tar czf oxl-toolchain-linux-x86_64.tar.gz oxl-toolchain
          sha256sum oxl-toolchain-linux-x86_64.tar.gz > oxl-toolchain-linux-x86_64.tar.gz.sha256
      # tag creation happens AFTER the suite gate so a failed gate never burns
      # a version; pushed via API because GITHUB_TOKEN tag pushes do not
      # retrigger on:push:tags — publish runs in this same run
      - name: tag commit
        if: github.ref_type != 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          SHA: ${{ needs.version.outputs.sha }}
        run: |
          set -eu
          exists=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$TAG" --jq length)
          if [ "$exists" != "0" ]; then
            ref_obj=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" \
              --jq '.object | "\(.sha) \(.type)"')
            actual=${ref_obj% *}
            if [ "${ref_obj##* }" = "tag" ]; then
              actual=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$actual" --jq .object.sha)
            fi
            if [ "$actual" != "$SHA" ]; then
              echo "tag $TAG points at $actual, expected $SHA" >&2
              exit 1
            fi
            echo "tag $TAG already exists on $SHA — reusing"
            exit 0
          fi
          tag_obj=$(gh api "repos/$GITHUB_REPOSITORY/git/tags" \
            -f tag="$TAG" -f message="release $TAG" \
            -f object="$SHA" -f type=commit --jq .sha)
          gh api "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$TAG" -f sha="$tag_obj"
      - name: github release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          files: |
            dist/oxl-toolchain-linux-x86_64.tar.gz
            dist/oxl-toolchain-linux-x86_64.tar.gz.sha256
          generate_release_notes: true


  # Editor assets ride the toolchain release: the vsix and the
  # platform-independent asset bundle are built from the tagged tree and
  # uploaded to the same GitHub release. The nvim mirror push and the
  # Open VSX publish are credential-gated and fail soft — a missing
  # secret must never block a toolchain release.
  editors:
    needs: [version, release]
    if: needs.version.outputs.do_tool == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # gh release upload
      id-token: write   # Open VSX trusted publishing (OIDC) fallback
      packages: write   # npm publish @oxidean/shiki-oxl to GitHub Packages
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          # vsce 4.x requires Node >= 22
          node-version: '22'
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - name: build vsix
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -eu
          cd editors/vscode
          npm ci --no-audit --no-fund
          node build.mjs
          # package.json version tracks the release tag so the vsix and
          # the Open VSX listing carry the toolchain version
          VER="${TAG#v}" node -e 'const fs=require("fs");const p="package.json";const j=JSON.parse(fs.readFileSync(p,"utf8"));j.version=process.env.VER;fs.writeFileSync(p,JSON.stringify(j,null,2)+"\n")'
          cp ../../LICENSE LICENSE
          npx --yes @vscode/vsce@4.1.0 package --no-dependencies --out dist/oxl-language.vsix
      - name: assemble editor assets
        run: |
          set -eu
          mkdir -p dist/assets/vscode dist/assets/grammars dist/assets/sublime dist/assets/nvim
          cp editors/vscode/dist/oxl-language.vsix dist/assets/vscode/
          cp editors/grammars/oxl.tmLanguage.json dist/assets/grammars/
          cp editors/grammars/oxl-mod.tmLanguage.json dist/assets/grammars/
          cp editors/sublime/oxl.sublime-syntax dist/assets/sublime/
          cp -r editors/nvim/. dist/assets/nvim/
          tar czf dist/oxl-editor-assets.tar.gz -C dist/assets .
          (cd dist && sha256sum oxl-editor-assets.tar.gz > oxl-editor-assets.tar.gz.sha256)
          # fixed names — releases/latest/download/<name> stays stable
          cp editors/vscode/dist/oxl-language.vsix dist/oxl-language.vsix
          cp editors/sublime/oxl.sublime-syntax dist/oxl.sublime-syntax
      - name: pack shiki-oxl
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -eu
          cd editors/grammars
          # version tracks the release tag, same trick as the vsix
          VER="${TAG#v}" node -e 'const fs=require("fs");const p="package.json";const j=JSON.parse(fs.readFileSync(p,"utf8"));j.version=process.env.VER;fs.writeFileSync(p,JSON.stringify(j,null,2)+"\n")'
          npm pack --pack-destination ../../dist
          # fixed name — releases/latest/download/shiki-oxl.tgz stays stable
          cp "../../dist/oxidean-shiki-oxl-${TAG#v}.tgz" ../../dist/shiki-oxl.tgz
      - name: upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -eu
          # needs: release means the GitHub release already exists; the
          # poll covers API-listing lag on fast reruns
          for i in $(seq 1 30); do
            gh release view "$TAG" >/dev/null 2>&1 && break
            sleep 10
          done
          gh release view "$TAG" >/dev/null
          gh release upload "$TAG" \
            dist/oxl-language.vsix \
            dist/oxl-editor-assets.tar.gz \
            dist/oxl-editor-assets.tar.gz.sha256 \
            dist/oxl.sublime-syntax \
            "dist/oxidean-shiki-oxl-${TAG#v}.tgz" \
            dist/shiki-oxl.tgz \
            --clobber
      - name: publish shiki-oxl to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -eu
          cd editors/grammars
          # package.json was stamped by the pack step; publishConfig.registry
          # + .npmrc route this to npm.pkg.github.com. Hard fail on error —
          # GITHUB_TOKEN + packages:write are always present in this job.
          # Idempotent across re-runs: skip when the version already exists.
          VER="${TAG#v}"
          if npm view --registry=https://npm.pkg.github.com \
              "@oxidean/shiki-oxl@$VER" version >/dev/null 2>&1; then
            echo "@oxidean/shiki-oxl@$VER already published — skipping"
            exit 0
          fi
          npm publish
      - name: mirror nvim-oxl
        env:
          MIRROR_TOKEN: ${{ secrets.OXLEDITOR_MIRROR_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          GH_TOKEN: ${{ secrets.OXLEDITOR_MIRROR_TOKEN }}
        run: |
          set -eu
          if [ -z "$MIRROR_TOKEN" ]; then
            echo "::notice::OXLEDITOR_MIRROR_TOKEN not set — skipping oxidean/nvim-oxl mirror push"
            exit 0
          fi
          git clone --depth 1 "https://x-access-token:${MIRR....git /tmp/nvim-oxl 2>/dev/null \
            || {
              gh api repos/oxidean/nvim-oxl >/dev/null 2>&1 \
                || { echo "::notice::oxidean/nvim-oxl does not exist — create it (or set OXLEDITOR_MIRROR_TOKEN with repo-create rights) to enable mirroring"; exit 0; }
              git clone --depth 1 "https://x-access-token:${MIRR....git /tmp/nvim-oxl
            }
          rsync -a --delete editors/nvim/ /tmp/nvim-oxl/
          cd /tmp/nvim-oxl
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          br=$(git branch --show-current)
          [ -n "$br" ] || br=main
          if [ -z "$(git status --porcelain)" ]; then
            echo "nvim-oxl mirror already carries $TAG content"
          else
            git add -A
            git commit -m "sync editors/nvim from oxl $TAG"
            git push -f origin "HEAD:refs/heads/$br" \
              || { echo "::warning::nvim-oxl branch push failed — check OXLEDITOR_MIRROR_TOKEN scopes"; exit 0; }
          fi
          git tag -f "$TAG"
          git push -f origin "refs/tags/$TAG:refs/tags/$TAG" \
            || echo "::warning::nvim-oxl tag push failed for $TAG"
      - name: publish Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -eu
          cd editors/vscode
          if npx --yes ovsx@1.3.0 publish dist/oxl-language.vsix --no-dependencies; then
            echo "Open VSX publish succeeded"
          elif [ -z "$OVSX_PAT" ]; then
            echo "::notice::Open VSX publish failed and no OVSX_PAT is set — configure the oxidean namespace for GitHub OIDC trusted publishing or set the OVSX_PAT secret"
          else
            echo "::warning::Open VSX publish failed with OVSX_PAT set — check the token/namespace"
          fi



  # The extras lane publishes the extra/ module on its own extra/v*
  # tag series: same "gate first, then tag, then release" order, but no
  # toolchain tarball — consumers fetch the module through OXLMODINDEX.
  extra:
    needs: version
    if: needs.version.outputs.do_extra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false
      - name: build stage-0 seed
        run: bash scripts/stage0.sh
      - name: extras gate (test every package)
        run: |
          set -eu
          for d in $(find extra -name '*.oxl' -exec dirname {} \; | sort -u); do
            echo "== test $d"
            ( cd "$d" && "$OLDPWD"/target/oxl test )
          done
      - name: tag commit
        if: github.ref_type != 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.etag }}
          SHA: ${{ needs.version.outputs.sha }}
        run: |
          set -eu
          exists=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$TAG" --jq length)
          if [ "$exists" != "0" ]; then
            ref_obj=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" \
              --jq '.object | "\(.sha) \(.type)"')
            actual=${ref_obj% *}
            if [ "${ref_obj##* }" = "tag" ]; then
              actual=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$actual" --jq .object.sha)
            fi
            if [ "$actual" != "$SHA" ]; then
              echo "tag $TAG points at $actual, expected $SHA" >&2
              exit 1
            fi
            echo "tag $TAG already exists on $SHA — reusing"
            exit 0
          fi
          tag_obj=$(gh api "repos/$GITHUB_REPOSITORY/git/tags" \
            -f tag="$TAG" -f message="release $TAG" \
            -f object="$SHA" -f type=commit --jq .sha)
          gh api "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$TAG" -f sha="$tag_obj"
      - name: github release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.etag }}
          name: oxl extras ${{ needs.version.outputs.etag }}
          generate_release_notes: true

  # Docs pack runs as a job in this workflow rather than its own push.tags
  # trigger: tags created here via the API (github.token) never fire tag-push
  # workflows, and running after the release job guarantees the Release the
  # bundle attaches to already exists — for both API-created and manually
  # pushed tags.
  docs-check:
    needs: [version, release]
    runs-on: ubuntu-latest
    outputs:
      has_docs: ${{ steps.check.outputs.has_docs }}
    steps:
      # Tags that predate docs/site cannot carry a bundle — the pack would
      # fail the manifest gate — so they skip the docs job instead of
      # failing an otherwise-green re-release.
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          err="$(mktemp)"
          if gh api "repos/$GITHUB_REPOSITORY/contents/docs/site/manifest.yaml?ref=$TAG" >/dev/null 2>"$err"; then
            echo "has_docs=true" >> "$GITHUB_OUTPUT"
          elif grep -qE 'HTTP 404' "$err"; then
            echo "has_docs=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$TAG predates docs/site — skipping docs pack"
          else
            cat "$err" >&2
            echo "::error::docs/site probe failed for $TAG (not a 404) — refusing to guess; retry the release"
            exit 1
          fi

  docs:
    needs: [version, release, docs-check]
    if: needs.docs-check.outputs.has_docs == 'true'
    permissions:
      contents: write
      issues: write   # reusable files a tracking issue when site dispatch fails
    uses: oxidean/docs-manifest/.github/workflows/release.yml@v0.1.7
    with:
      tag: ${{ needs.version.outputs.tag }}
      product: oxl
    secrets:
      site_dispatch_token: ${{ secrets.DOCS_SITE_DISPATCH_TOKEN }}
