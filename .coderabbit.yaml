# CodeRabbit configuration — see https://docs.coderabbit.ai/reference/configuration
reviews:
  profile: chill
  path_filters:
    # Only the materialized scaffold dirs are excluded — they are synced
    # from the upstream Ox-Agent repo and in-place edits are overwritten
    # by the next `ox-agent assets sync`, so findings on them belong
    # upstream. Everything else (work items, context, state, runtime)
    # stays in this repo's review surface.
    - "!.ox-agent/skills/**"
    - "!.ox-agent/schemas/**"
    - "!.ox-agent/pipelines/**"
    - "!.ox-agent/integrations/**"
    - "!.ox-agent/lifecycle/**"
    - "!.ox-agent/workflows/**"
  auto_approvals:
    enabled: true
  auto_review:
    ignore_title_keywords:
      # Bot-opened manifest-sync PRs from release.yml must merge unattended —
      # required_review_thread_resolution would deadlock them on a stray comment.
      - "bump docs manifest to"
  pre_merge_checks:
    docstrings:
      # This is a bootstrap-stage compiler repo; we do not gate merges on
      # docstring coverage. Doc comments stay welcome but unmeasured.
      mode: off
