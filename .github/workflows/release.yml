name: release

on:
  push:
    branches: [main]
    tags: ["v*", "extra/v*"]
  workflow_dispatch:

permissions:
  contents: write
  # The docs-manifest bump merges through a bot-opened PR — main's ruleset
  # requires changes to arrive via pull request.
  pull-requests: write

# serializes main merges and tag pushes so version computation never races
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      sha: ${{ steps.sha.outputs.sha }}
      etag: ${{ steps.v.outputs.etag }}
      do_tool: ${{ steps.v.outputs.do_tool }}
      do_extra: ${{ steps.v.outputs.do_extra }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags + history for semver scan
          persist-credentials: false
      - id: v
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$REF_NAME" != "main" ]; then
            echo "workflow_dispatch releases only from main" >&2
            exit 1
          fi
          echo "do_tool=false" >> "$GITHUB_OUTPUT"
          echo "do_extra=false" >> "$GITHUB_OUTPUT"
          echo "etag=" >> "$GITHUB_OUTPUT"
          if [ "$REF_TYPE" = "tag" ]; then
            tag_sha=$(git rev-list -n1 "$REF_NAME")
            # a release tag may only release commits that are on main —
            # otherwise a tag push could ship unreviewed code
            # (fetch-depth:0 gives origin/main)
            if ! git merge-base --is-ancestor "$tag_sha" origin/main; then
              echo "tag $REF_NAME points at $tag_sha, which is not on main" >&2
              exit 1
            fi
            case "$REF_NAME" in
              extra/v*)
                echo "do_extra=true" >> "$GITHUB_OUTPUT"
                echo "etag=$REF_NAME" >> "$GITHUB_OUTPUT"
                ;;
              *)
                echo "do_tool=true" >> "$GITHUB_OUTPUT"
                echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"
                ;;
            esac
            echo "sha=$tag_sha" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ -z "$EVENT_BEFORE" ] \
          || [ "$EVENT_BEFORE" = "0000000000000000000000000000000000000000" ] \
          || ! git cat-file -e "$EVENT_BEFORE^{commit}" 2>/dev/null; then
            range="HEAD~1..HEAD"
          else
            range="$EVENT_BEFORE..$SHA"
          fi
          # lane split: the toolchain releases when anything outside
          # extra/ moved since the last bare v* tag; extras get their own
          # extra/v* tag series when paths under extra/ moved since the
          # last extra/v* tag. A pure-extras merge ships only the extras
          # lane; a pure-toolchain merge only the toolchain lane.
          latest_v=$(scripts/release-version.sh latest)
          if [ -n "$latest_v" ]; then
            vbase=$(git rev-list -n1 "v$latest_v")
            changed=$(git diff --name-only "$vbase" "$SHA")
          else
            changed=$(git ls-files)
          fi
          latest_e=$(scripts/release-version.sh latest extra/)
          if [ -n "$latest_e" ]; then
            ebase=$(git rev-list -n1 "extra/v$latest_e")
            echanged=$(git diff --name-only "$ebase" "$SHA" -- extra/)
            erange="$ebase..$SHA"
          else
            echanged=$(git ls-files -- extra/)
            erange="HEAD"
          fi
          # recovery: a toolchain tag already on this sha — or on the
          # manifest-bump child this flow creates — is reused instead of
          # burning another version. The docs-manifest sync below tags a
          # bump commit one above the merge, so a retry's tag also lives
          # on a direct child of sha.
          tag=$(git tag --points-at "$SHA" | grep -xE 'v[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -1 || true)
          tagsha=""
          if [ -z "$tag" ]; then
            for child in $(git rev-list --all --children | awk -v s="$SHA" '$1==s {$1=""; print}'); do
              # Only the manifest-bump commit this flow creates is a valid
              # recovery target — a tagged child on another branch would
              # publish an unrelated tree under this tag.
              git merge-base --is-ancestor "$child" origin/main 2>/dev/null || continue
              git log -1 --format=%s "$child" | grep -q '^chore(release): bump docs manifest to ' || continue
              tag=$(git tag --points-at "$child" | grep -xE 'v[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -1 || true)
              [ -n "$tag" ] && { tagsha=$child; break; }
            done
          fi
          # lane gate: non-extra paths changed since the last toolchain
          # tag. A manual dispatch bypasses the path check only for tag
          # recovery — an untagged sha has nothing to recover, so an
          # extras-only dispatch must not mint a new toolchain release.
          if { [ -n "$changed" ] && printf '%s\n' "$changed" | grep -qv '^extra/'; } || { [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$tag" ]; }; then
            do_tool=true
            [ -n "$tagsha" ] && SHA=$tagsha
            if [ -z "$tag" ]; then
              tag=$(scripts/release-version.sh next "$range")
            fi
            echo "do_tool=true" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$echanged" ]; then
            etag=$(git tag --points-at "$SHA" | grep -xE 'extra/v[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -1 || true)
            [ -z "$etag" ] && etag=$(scripts/release-version.sh next "$erange" extra/)
            echo "do_extra=true" >> "$GITHUB_OUTPUT"
            echo "etag=$etag" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      # The docs bundle packs from the tagged tree and the packer gates the
      # manifest version against the tag, so an auto-release must tag a
      # commit whose docs/site/manifest.yaml already declares it. main is
      # PR-only, so the bump lands through a bot-opened squash merge and the
      # tag points at that merge commit. A tag already on this sha (a retry
      # after a failed publish) has a fixed tree — reuse it instead.
      - id: sha
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ steps.v.outputs.tag }}
          SHA: ${{ steps.v.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          emit() { echo "sha=$1" >> "$GITHUB_OUTPUT"; }
          if [ "$REF_TYPE" = "tag" ] || [ -z "$TAG" ]; then emit "$SHA"; exit 0; fi
          if git tag --points-at "$SHA" | grep -qx "$TAG"; then emit "$SHA"; exit 0; fi
          manifest=docs/site/manifest.yaml
          if [ ! -f "$manifest" ]; then
            echo "no docs/site manifest — release proceeds without a bundle"
            emit "$SHA"; exit 0
          fi
          ver="${TAG#v}"
          current="$(sed -nE 's/^version[[:space:]]*:[[:space:]]*"?([^"[:space:]]*)"?[[:space:]]*$/\1/p' "$manifest" | head -1)"
          if [ "$current" = "$ver" ]; then emit "$SHA"; exit 0; fi
          sed -i -E "s/^version[[:space:]]*:.*/version: \"$ver\"/" "$manifest"
          # The version line exists but can't be parsed or rewritten — the
          # tag would carry a stale manifest and the docs pack fails later.
          # Stop here, before the tag/publish steps, instead of shipping
          # the toolchain without its docs bundle.
          if git diff --quiet -- "$manifest"; then
            echo "::error::could not set docs manifest version to $ver (missing or unparseable version line)"
            exit 1
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -am "chore(release): bump docs manifest to $ver"
          git remote set-url origin "https://x-access-token:*** github.repository }}.git"
          git fetch origin main -q
          # A previous attempt may have merged the bump but died before
          # tagging — reuse the commit that set the version rather than
          # opening a second bump PR.
          bumped="$(git show "origin/main:$manifest" 2>/dev/null | sed -nE 's/^version[[:space:]]*:[[:space:]]*"?([^"[:space:]]*)"?[[:space:]]*$/\1/p' | head -1)"
          if [ "$bumped" = "$ver" ]; then
            emit "$(git rev-list -n1 --first-parent origin/main -- "$manifest")"
            exit 0
          fi
          # Open the bump as a PR and squash-merge it: main rejects direct
          # pushes. The merge commit carries the matching manifest and sits
          # on main, so it is the tag target.
          # The bump commit was made above on the detached HEAD — branching
          # here keeps it, so no second commit is needed.
          branch="docs-manifest-bump/$TAG"
          git checkout -b "$branch"
          git push -f origin "$branch"
          pr="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')"
          if [ -z "$pr" ]; then
            gh pr create --base main --head "$branch" \
              --title "chore(release): bump docs manifest to $ver" \
              --body "Automated docs-manifest sync for $TAG — the docs bundle packs from the tagged tree and gates on manifest.version == tag."
            # gh pr create prints only the URL — re-read the number via list.
            pr="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')"
          fi
          m=""
          for i in $(seq 1 30); do
            m="$(gh pr view "$pr" --json mergeable --jq '.mergeable')"
            [ "$m" = "MERGEABLE" ] && break
            if [ "$m" = "CONFLICTING" ]; then
              echo "::error::bump PR #$pr conflicts with main — rerun the release"
              exit 1
            fi
            sleep 2
          done
          [ "$m" = "MERGEABLE" ] || { echo "::error::bump PR #$pr never became mergeable"; exit 1; }
          # The default squash body folds in "Co-authored-by: github-actions[bot]"
          # (merger != author) and trips the bot-trailer ban in commit-lint —
          # pin an explicit message instead.
          gh pr merge "$pr" --squash --delete-branch \
            --subject "chore(release): bump docs manifest to $ver" \
            --body "Automated docs-manifest sync for $ver — the docs bundle packs from the tagged tree and gates on manifest.version == tag."
          mc=""
          for i in $(seq 1 15); do
            mc="$(gh pr view "$pr" --json mergeCommit,state --jq 'select(.state=="MERGED") | .mergeCommit.oid')"
            [ -n "$mc" ] && break
            sleep 2
          done
          [ -n "$mc" ] || { echo "::error::bump PR #$pr did not report merged"; exit 1; }
          emit "$mc"

  release:
    needs: version
    if: needs.version.outputs.do_tool == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false # build/test steps run dep code; publish uses github.token directly
      - uses: dtolnay/rust-toolchain@stable
      - name: build oxl
        run: cargo build --release --manifest-path oxl/Cargo.toml
      - name: test suite (gate)
        run: bash tests/run.sh ./oxl/target/release/oxl
      - name: package toolchain
        run: |
          mkdir -p dist/oxl-toolchain
          # the suite gate above built and validated the product driver
          # (target/oxl-self) — ship it, not the Rust seed it was
          # bootstrapped from
          cp target/oxl-self dist/oxl-toolchain/oxl
          cp -r std examples dist/oxl-toolchain/
          # the product driver locates runtime/rt.c beside the binary
          # (exe-walk) for the cc step, and gui_shim.c includes
          # ../../runtime/rt.h — ship both at the same relative spot
          mkdir -p dist/oxl-toolchain/runtime
          cp runtime/rt.h runtime/rt.c dist/oxl-toolchain/runtime/
          cp LICENSE dist/oxl-toolchain/
          # the repo README documents building from oxl/ and other paths
          # the archive doesn't ship — give it release-specific steps
          cat > dist/oxl-toolchain/README.md <<'EOF2'
          # oxl toolchain

          The `oxl` compiler plus `std/` library sources and `examples/` pilots.

          ```sh
          ./oxl run examples/hello.oxl    # compile + run (needs cc on PATH)
          ./oxl build examples/http-crud-sqlite/main.oxl   # sqlite pilots also need libsqlite3-dev
          ```

          `import "std/x"` resolves against `std/` next to the binary.
          EOF2
          cd dist && tar czf oxl-toolchain-linux-x86_64.tar.gz oxl-toolchain
      # tag creation happens AFTER the suite gate so a failed gate never burns
      # a version; pushed via API because GITHUB_TOKEN tag pushes do not
      # retrigger on:push:tags — publish runs in this same run
      - name: tag commit
        if: github.ref_type != 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          SHA: ${{ needs.version.outputs.sha }}
        run: |
          set -eu
          exists=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$TAG" --jq length)
          if [ "$exists" != "0" ]; then
            ref_obj=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" \
              --jq '.object | "\(.sha) \(.type)"')
            actual=${ref_obj% *}
            if [ "${ref_obj##* }" = "tag" ]; then
              actual=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$actual" --jq .object.sha)
            fi
            if [ "$actual" != "$SHA" ]; then
              echo "tag $TAG points at $actual, expected $SHA" >&2
              exit 1
            fi
            echo "tag $TAG already exists on $SHA — reusing"
            exit 0
          fi
          tag_obj=$(gh api "repos/$GITHUB_REPOSITORY/git/tags" \
            -f tag="$TAG" -f message="release $TAG" \
            -f object="$SHA" -f type=commit --jq .sha)
          gh api "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$TAG" -f sha="$tag_obj"
      - name: github release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          files: dist/oxl-toolchain-linux-x86_64.tar.gz
          generate_release_notes: true


  # The extras lane publishes the extra/ module on its own extra/v*
  # tag series: same "gate first, then tag, then release" order, but no
  # toolchain tarball — consumers fetch the module through OXLMODINDEX.
  extra:
    needs: version
    if: needs.version.outputs.do_extra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: build oxl
        run: cargo build --release --manifest-path oxl/Cargo.toml
      - name: extras gate (test every package)
        run: |
          set -eu
          for d in $(find extra -name '*.oxl' -exec dirname {} \; | sort -u); do
            echo "== test $d"
            ( cd "$d" && "$OLDPWD"/oxl/target/release/oxl test )
          done
      - name: tag commit
        if: github.ref_type != 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.etag }}
          SHA: ${{ needs.version.outputs.sha }}
        run: |
          set -eu
          exists=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$TAG" --jq length)
          if [ "$exists" != "0" ]; then
            ref_obj=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" \
              --jq '.object | "\(.sha) \(.type)"')
            actual=${ref_obj% *}
            if [ "${ref_obj##* }" = "tag" ]; then
              actual=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$actual" --jq .object.sha)
            fi
            if [ "$actual" != "$SHA" ]; then
              echo "tag $TAG points at $actual, expected $SHA" >&2
              exit 1
            fi
            echo "tag $TAG already exists on $SHA — reusing"
            exit 0
          fi
          tag_obj=$(gh api "repos/$GITHUB_REPOSITORY/git/tags" \
            -f tag="$TAG" -f message="release $TAG" \
            -f object="$SHA" -f type=commit --jq .sha)
          gh api "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$TAG" -f sha="$tag_obj"
      - name: github release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.etag }}
          name: oxl extras ${{ needs.version.outputs.etag }}
          generate_release_notes: true

  # Docs pack runs as a job in this workflow rather than its own push.tags
  # trigger: tags created here via the API (github.token) never fire tag-push
  # workflows, and running after the release job guarantees the Release the
  # bundle attaches to already exists — for both API-created and manually
  # pushed tags.
  docs-check:
    needs: [version, release]
    runs-on: ubuntu-latest
    outputs:
      has_docs: ${{ steps.check.outputs.has_docs }}
    steps:
      # Tags that predate docs/site cannot carry a bundle — the pack would
      # fail the manifest gate — so they skip the docs job instead of
      # failing an otherwise-green re-release.
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          err="$(mktemp)"
          if gh api "repos/$GITHUB_REPOSITORY/contents/docs/site/manifest.yaml?ref=$TAG" >/dev/null 2>"$err"; then
            echo "has_docs=true" >> "$GITHUB_OUTPUT"
          elif grep -qE 'HTTP 404' "$err"; then
            echo "has_docs=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$TAG predates docs/site — skipping docs pack"
          else
            cat "$err" >&2
            echo "::error::docs/site probe failed for $TAG (not a 404) — refusing to guess; retry the release"
            exit 1
          fi

  docs:
    needs: [version, release, docs-check]
    if: needs.docs-check.outputs.has_docs == 'true'
    permissions:
      contents: write
    uses: oxidean/docs-manifest/.github/workflows/release.yml@v0.1.6
    with:
      tag: ${{ needs.version.outputs.tag }}
      product: oxl
    secrets:
      site_dispatch_token: ${{ secrets.DOCS_SITE_DISPATCH_TOKEN }}
